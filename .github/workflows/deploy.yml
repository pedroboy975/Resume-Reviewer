name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `next build` já roda o TypeScript. Um `tsc --noEmit` separado antes
      # dele falha em checkout limpo: `LayoutProps` é gerado pelo próprio
      # build em `.next/types/`, e ainda não existe.
      #
      # Os testes não rodam aqui: dependem de PDFs reais que não são
      # versionados. Ver tests/fixtures/README.md.
      - run: npm run build

      # Sem isto o Jekyll do Pages ignora a pasta `_next` — nome começando
      # com underscore — e a página sai sem CSS nem JS.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
